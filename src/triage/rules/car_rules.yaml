# Map from each decision the rule engine can make to the provision that supports it.
#
# `id` is the clause identifier produced by the chunker (<DOC>:<paragraph>). `terms` are phrases that must appear in
# the retrieved text of that clause for the verifier to accept the citation: if the corpus is replaced (e.g. by the
# official CAR PDF) and a paragraph moves or its wording changes, verification fails and the run escalates instead
# of citing a provision that does not say what the system claims. Update this file after re-ingesting a new corpus.
clauses:
  categories:          {id: "CAR:2.6", terms: ["Cancellation"]}
  def_alternate:       {id: "CAR:2.1", terms: ["Alternate flight", "acceptable to the passenger"]}
  def_block_time:      {id: "CAR:2.2", terms: ["Block time"]}
  def_basic_fare:      {id: "CAR:2.4", terms: ["Basic fare"]}
  applicability:       {id: "CAR:3.1.1", terms: ["foreign air carriers are not covered"]}
  checkin:             {id: "CAR:3.1.2", terms: ["check-in", "one hour"]}
  excluded_claims:     {id: "CAR:3.1.3", terms: ["baggage"]}
  db_volunteers:       {id: "CAR:3.2.1", terms: ["volunteers", "not entitled to compensation"]}
  db_within_1h:        {id: "CAR:3.2.2", terms: ["No compensation shall be payable", "within one hour"]}
  db_within_24h:       {id: "CAR:3.2.2", terms: ["200%", "INR 10,000"]}
  db_beyond_24h:       {id: "CAR:3.2.2", terms: ["more than 24 hours", "400%", "INR 20,000"]}
  db_not_opted:        {id: "CAR:3.2.2", terms: ["does not opt for the alternate flight", "400%", "INR 20,000"]}
  db_exceptions:       {id: "CAR:3.2.3", terms: ["shall not be liable", "check-in"]}
  cx_two_weeks:        {id: "CAR:3.3.1", terms: ["at least two weeks", "No compensation is payable"]}
  cx_under_two_weeks:  {id: "CAR:3.3.1", terms: ["less than two weeks", "within two hours", "No compensation is payable"]}
  cx_scope_3_3_2:      {id: "CAR:3.3.2", terms: ["less than 24 hours", "either an alternate flight or compensation"]}
  cx_cap_1h:           {id: "CAR:3.3.2", terms: ["INR 5,000", "whichever is less", "up to and including one hour"]}
  cx_cap_2h:           {id: "CAR:3.3.2", terms: ["INR 7,500", "whichever is less", "up to and including two hours"]}
  cx_cap_over_2h:      {id: "CAR:3.3.2", terms: ["INR 10,000", "whichever is less", "more than two hours"]}
  cx_alt_accepted:     {id: "CAR:3.3.2", terms: ["accepts the alternate flight", "no compensation"]}
  cx_facilities_ref:   {id: "CAR:3.3.2", terms: ["facilities in accordance with para 3.4.1"]}
  cx_contact:          {id: "CAR:3.3.3", terms: ["contact details", "shall not be liable"]}
  cx_extraordinary:    {id: "CAR:3.3.4", terms: ["extraordinary circumstances", "shall not be liable"]}
  meals:               {id: "CAR:3.4.1", terms: ["meals and refreshments", "waiting time"]}
  delay_alt_refund:    {id: "CAR:3.4.2", terms: ["more than 6 hours", "alternate flight", "refund"]}
  hotel:               {id: "CAR:3.4.3", terms: ["hotel accommodation"]}
  delay_no_comp:       {id: "CAR:3.4.4", terms: ["No monetary compensation is payable for delay"]}
  dg_domestic:         {id: "CAR:3.5.1", terms: ["domestic sectors, 75%", "including taxes"]}
  dg_intl_1500:        {id: "CAR:3.5.1", terms: ["1,500 km or less, 30%"]}
  dg_intl_3500:        {id: "CAR:3.5.1", terms: ["3,500 km, 50%"]}
  dg_intl_long:        {id: "CAR:3.5.1", terms: ["more than 3,500 km, 75%"]}
  dg_requested:        {id: "CAR:3.5.2", terms: ["requested by the passenger"]}
  ec_list:             {id: "CAR:3.6.1", terms: ["extraordinary circumstances beyond the control of the airline"]}
  ec_general_test:     {id: "CAR:3.6.2", terms: ["burden of establishing extraordinary circumstances", "general test"]}
  charter_dg_intl:     {id: "CHARTER:6.2", terms: ["International sectors", "difference between the fare paid"]}
  grievance:           {id: "CAR:3.8.1", terms: ["AirSewa"]}

# Clauses that must have been retrieved before a decision in a category is accepted: the conditions and exemptions
# that could remove an entitlement (F4). The verifier checks these are in the agent's evidence.
required_by_category:
  cancellation: ["CAR:3.3.1", "CAR:3.3.2", "CAR:3.3.3", "CAR:3.3.4", "CAR:3.6.1"]
  denied_boarding: ["CAR:3.2.1", "CAR:3.2.2", "CAR:3.2.3", "CAR:3.6.1"]
  delay: ["CAR:3.4.1", "CAR:3.4.4"]
  downgrading: ["CAR:3.5.1", "CAR:3.5.2"]

# Cause attribution (CAR 3.6). Listed circumstances exempt compensation unless the passenger disputes them;
# ambiguous ones need the general test in 3.6.2 and go to a human; clearly internal ones do not exempt.
causes:
  listed: ["weather", "fog", "storm", "cyclone", "rain", "flood", "earthquake", "natural disaster", "air traffic",
           "atc", "airspace", "strike", "security", "political", "riot", "civil war", "insurrection", "explosion",
           "government", "sabotage", "volcanic"]
  ambiguous: ["technical", "snag", "maintenance", "mechanical", "bird strike", "safety", "engineering", "it outage",
              "system failure", "medical"]
  internal: ["crew", "staff shortage", "commercial", "operational reasons", "overbooking", "overbooked",
             "low bookings", "scheduling", "rotation", "late arrival of the incoming aircraft"]
