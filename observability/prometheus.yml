global:
  scrape_interval: 5s
  evaluation_interval: 15s

# DNS service discovery resolves a Compose service name to every replica, so
# `docker compose up --scale agent-worker=3` is scraped per replica with no config change.
scrape_configs:
  - job_name: api
    dns_sd_configs: [{names: [api], type: A, port: 8000, refresh_interval: 10s}]
  - job_name: retriever
    dns_sd_configs: [{names: [retriever], type: A, port: 8000, refresh_interval: 10s}]
  - job_name: llm-gateway
    dns_sd_configs: [{names: [llm-gateway], type: A, port: 8000, refresh_interval: 10s}]
  - job_name: llm-stub
    dns_sd_configs: [{names: [llm-stub], type: A, port: 8000, refresh_interval: 10s}]
  - job_name: intake-agent
    dns_sd_configs: [{names: [intake-agent], type: A, port: 9100, refresh_interval: 10s}]
  - job_name: agent-worker
    dns_sd_configs: [{names: [agent-worker], type: A, port: 9100, refresh_interval: 10s}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
